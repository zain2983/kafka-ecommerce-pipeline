# Kept inside the project (not ~/.dbt/profiles.yml) so this repo is
# self-contained - run dbt with DBT_PROFILES_DIR=. (or --profiles-dir .)
# from this directory. Same env vars as ingestion/app/database.py's
# DatabaseConfig, so both point at the same Postgres by default without
# duplicating configuration.
ecommerce_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('POSTGRES_DB', 'ecommerce') }}"
      user: "{{ env_var('POSTGRES_USER', 'ecommerce') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'ecommerce') }}"
      schema: public
      threads: 4
