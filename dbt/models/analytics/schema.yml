version: 2

models:
  - name: sales_by_interval
    description: One row per 15-minute bucket with PURCHASE activity (design.md section 18).
    columns:
      - name: interval_start
        tests:
          - unique
          - not_null
      - name: orders
        tests:
          - not_null
      - name: units_sold
        tests:
          - not_null
      - name: revenue
        tests:
          - not_null
