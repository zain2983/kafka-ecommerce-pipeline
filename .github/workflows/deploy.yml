name: Deploy to VM

# Auto-deploys after ci.yml passes on main (workflow_run below), so a
# merge to main reaches the VM without a manual step. workflow_dispatch
# is kept too, for a one-off manual re-deploy (e.g. re-running after a
# VM-side fix with no code change).
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch has no `workflow_run` conclusion to check -
    # always run for that trigger. For workflow_run, only deploy if
    # ci.yml actually passed (don't ship on a red build).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Trust the VM's host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # The key used here is restricted server-side (see
      # scripts/deploy_remote.sh's header) to running exactly one
      # script - it cannot open an arbitrary shell on the VM even if
      # this secret leaked.
      - name: Run deploy_remote.sh on the VM
        run: |
          umask 077
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          rm -f deploy_key
